name: Research checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
      - name: Verify recorded artifacts
        run: python verify_package.py
      - name: Exercise the public examples
        run: |
          python examples/explore_results.py
          python examples/explore_results.py --example
          python examples/compare_prompts.py
      - name: Run portable tests
        run: python tools/run_tests.py
