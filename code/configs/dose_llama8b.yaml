# ============================================================================
# FINAL SCALED JACOBIAN-LENS STUDY — continuous prior-score dose direction (llama8b)
# ============================================================================
# 11 numeric conditions score_0..score_10 define the dose axis. no_history is a
# structural reference only: never given a numeric dose, never in the regression
# or the permutation test.
#
# INDEXING (mandatory): jlens layer i == hidden_states[i+1]. Verified at run time
# for this model; the run aborts if it does not hold.

include:
  - configs/models.yaml
  - configs/datasets.yaml

dose:
  name: DOSE_DIRECTION_llama8b
  judge_model: llama8b
  source_glob: results/arenahard/judge/*/records.jsonl
  score0_records: results/exploratory_score0/arenahard/records.jsonl
  out_dir: results/dose_direction
  history_template: dyadic_anon_prior_round
  lens_repo: neuronpedia/jacobian-lens
  lens_file: llama3.1-8b-it/jlens/Salesforce-wikitext/Llama-3.1-8B-Instruct_jacobian_lens.pt
  lens_revision: a4114d7752d11eb546e6cf372213d7e75526d3a1
  lens_sha256: d5300a1575c0b5ad6e01b098c75adb072f3a6c246f184ce2fb35a3550fc8c68b
