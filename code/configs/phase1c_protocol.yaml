# Phase 1C — output-protocol calibration. Same manipulation, emission order varied.
# NOT YET APPROVED TO RUN.
#
# Tests whether ordering itself moves the score. score_only carries no justification, so
# any silence analysis is restricted to the two protocols that produce one.
#
# Grid: 20 prompts x 5 conditions x 3 protocols x 3 judges x K=2 = 1800 calls

include:
  - configs/models.yaml
  - configs/datasets.yaml

candidates:
  path: data/candidates/pinned_candidates_v1.json

experiment:
  name: phase1c_protocol
  seed: 42
  datasets: [arena_hard_v2]
  n_prompts: 20
  judge_models: [llama8b, qwen8b, qwen14b]
  evaluated_models: [gemma]
  candidates_per_prompt: 1
  exclude_self_judging: true
  prior_context_conditions: [no_history, score_1, score_3, score_7, score_10]
  rubric_variants: [grounded]
  output_protocols: [score_only, score_then_justification, justification_then_score]
  history_template: dyadic_anon_prior_round
  replicates: 2

generation:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 320
  do_sample: false
